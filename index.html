<style>
:root{
  --bg:#fdfcf8; --surface:#ffffff; --fg:#1b2a1f; --muted:#6b6357; --line:#ece6db;
  --leaf:#163a22; --leaf-2:#1f4d2d; --seed:#fff1c9; --seed-ink:#5a3e1b; --soil:#7b5434; --soil-soft:#f6efe5;
  --sun-1:#fff4d4; --sun-2:#fffbf0; --on-hero:#163a22;
  --promo:#a5402d; --wa:#1d8a4d; --map-bg:#f3efe6; --map-road:#ffffff; --map-block:#e6dfd1;
  --warn-bg:#fff8e4; --warn-line:#ecd9a6; --photo:#ffffff;
  --display:"Zilla Slab", Georgia, serif; --body:"Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1611; --surface:#161f18; --fg:#e8ede4; --muted:#b0a796; --line:#2a332b;
  --leaf:#0f2618; --leaf-2:#7fbf8c; --seed:#3a3120; --seed-ink:#f3dfae; --soil:#d1a77f; --soil-soft:#221c16;
  --sun-1:#2a2617; --sun-2:#161f18; --on-hero:#e8ede4;
  --promo:#ff9a85; --wa:#2fa863; --map-bg:#1a221b; --map-road:#2e382f; --map-block:#232c24;
  --warn-bg:#231f12; --warn-line:#5a4a22; --photo:#f4f4f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1611; --surface:#161f18; --fg:#e8ede4; --muted:#b0a796; --line:#2a332b;
  --leaf:#0f2618; --leaf-2:#7fbf8c; --seed:#3a3120; --seed-ink:#f3dfae; --soil:#d1a77f; --soil-soft:#221c16;
  --sun-1:#2a2617; --sun-2:#161f18; --on-hero:#e8ede4;
  --promo:#ff9a85; --wa:#2fa863; --map-bg:#1a221b; --map-road:#2e382f; --map-block:#232c24;
  --warn-bg:#231f12; --warn-line:#5a4a22; --photo:#f4f4f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{background:var(--leaf);color:#f2f6ee;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:0 0 auto}
.logo{background:linear-gradient(140deg,#fffdf4 0%,#fff1c2 38%,#ffd978 78%,#f7c45a 100%);border-radius:12px;padding:4px 9px;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 0 0 1.5px rgba(255,241,201,.85),0 6px 18px rgba(0,0,0,.28)}
.logo-svg{display:block;width:92px;height:auto}
.brand b{font-family:var(--display);font-size:1.75rem;line-height:1;display:block;letter-spacing:.02em}
.brand small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{padding:8px 12px;border-radius:6px;text-decoration:none;font-weight:600}
nav.main a:hover,nav.main a[aria-current="page"]{background:rgba(255,255,255,.12)}
nav.main a[aria-current="page"]{box-shadow:inset 0 -3px 0 #f7dc94}
.enc-preco{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.enc-aviso{margin:0 0 8px;font-size:.78rem;line-height:1.3;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--fg);border-radius:8px;padding:6px 8px}
.enc-tag{font-style:normal;color:var(--soil);font-weight:600}
.tema-btn{all:unset;box-sizing:border-box;cursor:pointer;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:#f2f6ee;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.tema-btn:hover{background:rgba(255,255,255,.12)}
.tema-btn:focus-visible{outline:2px solid var(--seed);outline-offset:2px}
.tema-btn svg{width:21px;height:21px}
[data-theme="dark"] .ico-lua,:root:not([data-theme="dark"]) .ico-sol{display:none}
.search{flex:1 1 220px;max-width:320px;display:flex}
.search input{width:100%;border:0;border-radius:6px;padding:9px 12px;font:inherit;background:#fff;color:#1f2a1c}
.search input:focus{outline:3px solid var(--seed)}

/* Corpo */
.layout{display:grid;grid-template-columns:240px 1fr;gap:28px;padding-block:24px 80px;align-items:start}
aside{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
aside h2{font-family:var(--display);font-size:1rem;margin:8px 10px 6px;color:var(--soil);text-transform:uppercase;letter-spacing:.08em}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;padding:10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-radius:6px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400;color:var(--muted)}
details[open] summary::after{content:"–"}
summary:hover{background:var(--soil-soft)}
.subs{display:flex;flex-direction:column;padding:0 0 8px 10px}
.subs button{all:unset;cursor:pointer;padding:6px 10px;border-radius:6px;color:var(--muted);font-size:.93rem}
.subs button:hover,.subs button.on{color:var(--fg);background:var(--soil-soft)}
.subs button.on{font-weight:700;box-shadow:inset 3px 0 0 var(--leaf-2)}
.subs button:focus-visible,summary:focus-visible{outline:2px solid var(--leaf-2)}
.btn.dep-toggle{display:none}

main{min-width:0}
.hero{background:linear-gradient(180deg,var(--sun-1) 0%,var(--sun-2) 75%);color:var(--on-hero);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;overflow:hidden}
.hero h1{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0 0 16px;max-width:46ch;color:var(--muted)}
.tag{display:inline-block;background:var(--surface);border:1px solid var(--warn-line);color:var(--soil);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn-seed{background:var(--leaf);color:#fff}
.btn-wa{background:var(--wa);color:#fff;width:100%;justify-content:center;text-align:center}
.acoes{margin-top:2px}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.hero svg{width:100%;max-width:260px;justify-self:end}

/* Atalhos de departamento */
.shortcuts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.shortcut{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:32px 1fr;column-gap:10px;align-items:center}
.shortcut .ic{grid-row:span 2}
#view > section.block:first-child{margin-top:0}
.shortcut:hover{border-color:var(--leaf-2)}
.shortcut:focus-visible{outline:2px solid var(--leaf-2)}
.shortcut .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.shortcut .ic svg{width:20px;height:20px}
.shortcut b{font-size:.9rem;line-height:1.2}
.shortcut span:not(.ic){font-size:.74rem;color:var(--muted);line-height:1.25}

section.block{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-size:1.5rem;margin:0;color:var(--leaf-2)}
.sec-head h2::after{content:"";display:block;width:36px;height:2px;background:var(--soil);opacity:.55;margin-top:6px;border-radius:2px}
.link{color:var(--leaf-2);font-weight:600;cursor:pointer;background:none;border:0;font:inherit;padding:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;display:grid;place-items:center;position:relative;border:0;padding:0;width:100%;cursor:pointer;font:inherit}
.thumb:focus-visible,.ver-tit:focus-visible{outline:3px solid var(--leaf-2);outline-offset:-3px}
.ver-tit{all:unset;cursor:pointer;color:inherit}
.ver-tit:hover{color:var(--leaf-2);text-decoration:underline;text-underline-offset:3px}
.btn-add{background:var(--leaf);color:#fff;width:100%;justify-content:center;text-align:center}
.btn-add:hover{background:var(--leaf-2)}
.qtd{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1.5px solid var(--leaf-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.qtd button{all:unset;cursor:pointer;height:40px;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:var(--leaf-2);background:var(--soil-soft)}
.qtd button:focus-visible{outline:2px solid var(--leaf-2);outline-offset:-2px}
.qtd span{text-align:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.qtd span small{display:block;font-weight:600;font-size:.7rem;color:var(--muted)}
.opcoes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.opcoes button{all:unset;cursor:pointer;font-size:.8rem;font-weight:600;padding:5px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--fg);background:var(--surface);white-space:nowrap}
.opcoes button:hover{border-color:var(--leaf-2)}
.opcoes button.on{border-color:var(--leaf-2);background:var(--leaf-2);color:#fff}
.opcoes button i{font-style:normal;background:#fff1c9;color:#5a3e1b;border-radius:999px;padding:0 6px;margin-left:2px;font-size:.72rem}
.opcoes button:focus-visible{outline:2px solid var(--leaf-2);outline-offset:2px}
.op-sel{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.82rem;font-weight:600;color:var(--muted)}
.op-sel select{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--fg);padding:7px 8px;border:1.5px solid var(--leaf-2);border-radius:8px;background:var(--surface)}
.op-ped{display:block;font-size:.75rem;color:var(--soil);margin:-4px 0 8px}
.pedido-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.06))}
.pedido-bar button{all:unset;box-sizing:border-box;cursor:pointer;max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;background:var(--leaf);color:#fff;border-radius:12px;padding:13px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pedido-bar button:focus-visible{outline:3px solid #f7dc94}
.pedido-bar .ver-ped{margin-left:auto;font-weight:700;color:#fff1c9;white-space:nowrap}
body.tem-pedido .wa-float{display:none}
body.tem-pedido footer{padding-bottom:96px}
dialog{border:0;border-radius:14px;padding:0;max-width:min(860px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,25,18,.55)}
.fechar{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1rem;cursor:pointer}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.det-media{position:relative;display:grid;place-items:center;aspect-ratio:1/1}
.det-media.has-photo{background:var(--photo)!important}
.det-media img{width:100%;height:100%;object-fit:contain;padding:24px}
.det-media svg{width:45%}
.det-media svg.ilu{width:88%}
.det-info{padding:28px 24px 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.det-info h2{font-family:var(--display);font-size:1.6rem;line-height:1.15;margin:0;color:var(--leaf-2);padding-right:36px}
.det-info p{margin:4px 0;max-width:52ch}
.det-info .price strong{font-size:1.5rem}
.det-info .acoes{margin-top:8px}
.det-info .price{margin-top:6px;padding-top:0}
.obs{font-size:.85rem;color:var(--muted);margin:0}
.so-este{font-size:.88rem;margin-top:4px}
#dlgPedido{max-width:560px;padding:22px 20px 20px}
#dlgPedido h2{font-family:var(--display);color:var(--leaf-2);margin:0 0 4px;font-size:1.5rem}
.itens{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.itens li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mini{width:56px;height:56px;border-radius:8px;display:grid;place-items:center;overflow:hidden;position:relative}
.mini.has-photo{background:var(--photo)!important;border:1px solid var(--line)}
.mini img{width:100%;height:100%;object-fit:contain;padding:3px}
.mini svg{width:60%}.mini svg.ilu{width:100%}.mini .ilu-tag{display:none}
.itens .info{display:flex;flex-direction:column;min-width:0;font-size:.85rem;color:var(--muted)}
.itens .info b{color:var(--fg);font-size:.95rem}
.itens .vl{color:var(--leaf-2);font-weight:700}
.mini-q{grid-template-columns:34px 30px 34px}
.mini-q button{height:34px;font-size:1.1rem}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);padding-top:12px;margin-top:4px}
.total strong{font-size:1.35rem;color:var(--leaf-2);font-variant-numeric:tabular-nums}
.campo{display:flex;flex-direction:column;gap:4px;margin:14px 0 12px;font-weight:600;font-size:.9rem}
.campo input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.btn.grande{padding:14px 16px;font-size:1.02rem}
.limpar{display:block;margin:12px auto 0;font-size:.88rem;color:var(--muted)}
.vazio{color:var(--muted);padding:20px 0}
@media (max-width:640px){
  .det{grid-template-columns:minmax(0,1fr)}
  .det-media{aspect-ratio:4/3}
  dialog{max-width:100vw;width:100vw;max-height:92dvh;margin:auto 0 0;border-radius:16px 16px 0 0}
  #dlgPedido{max-width:100vw}
}
.thumb svg{width:40%;height:auto}
.thumb.has-photo{background:var(--photo)!important}
.thumb svg.ilu{width:86%}
.ilu-tag{position:absolute;right:8px;top:8px;font-size:.66rem;font-weight:600;color:#7b5434;background:#fff;border:1px solid #ecd9a6;border-radius:999px;padding:1px 8px}
.thumb img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.badge{position:absolute;top:10px;left:10px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;z-index:1}
.b-promo{background:var(--promo);color:#fff}
.b-novo{background:var(--seed);color:var(--seed-ink);border:1px solid var(--warn-line)}
.b-consulta{background:var(--soil);color:#fff}
.b-restrito{background:var(--leaf);color:#fff}
.restr{font-size:.8rem;color:var(--soil);background:var(--soil-soft);border-radius:6px;padding:6px 8px;line-height:1.35}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;border-top:1px solid var(--line)}
.cat{font-size:.72rem;color:var(--soil);text-transform:uppercase;letter-spacing:.08em}
.card h3{font-size:1rem;margin:0;line-height:1.3}
.unit{font-size:.85rem;color:var(--muted)}
.price{margin-top:auto;padding-top:6px;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-size:.85rem;margin-right:6px}
.price strong{font-size:1.2rem;color:var(--leaf-2)}
.price .ask{font-weight:700;color:var(--soil)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border-radius:10px;border:1px dashed var(--line)}
.crumb{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.93rem}
.notice b{display:block;margin-bottom:2px}

/* Sobre */
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}
.panel h2{font-family:var(--display);margin:0 0 10px;font-size:1.4rem}
.panel p{max-width:62ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dt{color:var(--muted);font-weight:600}
dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.map{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-top:14px;background:var(--map-bg)}
.map svg{display:block;width:100%;height:auto}
.map-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);flex-wrap:wrap;font-size:.92rem}

.wa-float{transition:opacity .2s,transform .2s;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#fff;border-radius:999px;padding:12px 18px 12px 14px;display:flex;gap:8px;align-items:center;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:30}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;padding-block:20px 28px}
.wa-float.oculto{opacity:0;transform:translateY(20px);pointer-events:none}
.proto{background:var(--seed);color:var(--seed-ink);border-bottom:1px solid var(--warn-line);font-size:.82rem;text-align:center;padding-block:6px;font-weight:600}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;display:none}
  aside.open{display:block}
  .shortcuts{display:none}
  body.pg-inicio .shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
  .btn.dep-toggle{display:flex;width:100%;justify-content:center;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
  .hero{grid-template-columns:1fr}
  .hero svg{display:none}
  .about{grid-template-columns:1fr}
  nav.main{margin-left:0;order:3;width:100%}
  .tema-btn{order:5}
  .search{order:4;max-width:none}
}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card-body{padding:10px}
  .price strong{font-size:1.05rem}
  .price s{display:block;margin:0}
  .btn-wa{padding:9px 8px;font-size:.88rem}
  .shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wa-float span{display:none} .wa-float{padding:14px}
  nav.main a{padding:8px 8px}
}

/* ===== Celular: lista compacta para ver mais itens na tela ===== */
@media (max-width:600px){
  body{font-size:14px}
  .proto{font-size:.72rem;padding-block:3px}
  .top{gap:8px 10px;padding-block:8px}
  .logo{padding:2px 5px;border-radius:8px}
  .logo-svg{width:64px}
  nav.main{order:2;width:auto;margin-left:auto;gap:0}
  .tema-btn{order:4;width:38px;height:38px}
  nav.main a{padding:6px 7px;font-size:.84rem}
  .search{order:3;flex:1 1 calc(100% - 48px);min-width:0}
  .search input{padding:8px 10px}
  .layout{gap:12px;padding-block:12px 70px}
  .btn.dep-toggle{padding:8px 12px;font-size:.88rem}
  body.pg-inicio .shortcuts{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
  .shortcut{grid-template-columns:1fr;justify-items:center;text-align:center;padding:8px 4px;row-gap:4px}
  .shortcut .ic{grid-row:auto;width:28px;height:28px}
  .shortcut .ic svg{width:17px;height:17px}
  .shortcut b{font-size:.68rem;line-height:1.15}
  .shortcut span:not(.ic){display:none}
  section.block{margin-top:20px}
  .sec-head{margin-bottom:8px}
  .sec-head h2{font-size:1.2rem}
  .sec-head h2::after{margin-top:4px}
  .grid{grid-template-columns:1fr;gap:8px}
  .card{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:start}
  .thumb{width:84px;height:84px;aspect-ratio:auto;margin:10px 0 10px 10px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{padding:4px}
  .thumb svg{width:46%}
  .thumb svg.ilu{width:100%}
  .ilu-tag{display:none}
  .badge{top:3px;left:3px;font-size:.55rem;padding:2px 4px;letter-spacing:.02em}
  .card-body{border-top:0;padding:9px 10px 10px;gap:2px}
  .cat{font-size:.62rem}
  .card h3{font-size:.92rem;line-height:1.25}
  .unit{font-size:.76rem}
  .restr{font-size:.72rem;padding:4px 6px}
  .price{padding-top:2px}
  .price strong{font-size:1rem}
  .price s{display:inline;font-size:.75rem;margin-right:6px}
  .acoes{margin-top:6px}
  .btn-add,.acoes .btn-wa{padding:7px 12px;font-size:.8rem;border-radius:7px;width:auto}
  .acoes .qtd{max-width:200px}
  .qtd{grid-template-columns:34px 1fr 34px}
  .qtd button{height:32px;font-size:1.1rem}
  .opcoes{gap:4px;margin-bottom:6px}
  .opcoes button{padding:3px 7px;font-size:.72rem}
  .op-sel{font-size:.74rem;margin-bottom:6px}
  .op-sel select{padding:5px 6px}
  .notice{font-size:.8rem;padding:10px 12px}
  .crumb{font-size:.78rem}
  .pedido-bar button{padding:10px 14px}
}

/* ===== Céu de amanhecer ao fundo ===== */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 82% 0%, var(--sol-1) 0, var(--sol-2) 16%, transparent 42%),
    linear-gradient(180deg, var(--ceu-1) 0%, var(--ceu-2) 28%, var(--ceu-3) 62%, var(--bg) 100%);}
:root{--ceu-1:#ffeeb8;--ceu-2:#fff5d6;--ceu-3:#fdfbf2;--sol-1:rgba(255,206,84,.55);--sol-2:rgba(255,224,140,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ceu-1:#1d2a1f;--ceu-2:#16201a;--ceu-3:#121a14;--sol-1:rgba(255,196,84,.18);--sol-2:rgba(255,196,84,.06)}
  :root:not([data-theme="light"]) body::before{opacity:.9}}
:root[data-theme="dark"]{--ceu-1:#1d2a1f;--ceu-2:#16201a;--ceu-3:#121a14;--sol-1:rgba(255,196,84,.18);--sol-2:rgba(255,196,84,.06)}
/* ===== Busca com lupa ===== */
.search{position:relative;align-items:center}
.search .lupa{position:absolute;left:11px;width:17px;height:17px;color:#6d7a66;pointer-events:none}
.search input{padding-left:36px}
/* ===== Ícones dos atalhos ===== */
.shortcut .ic{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.shortcut .ic svg{width:22px;height:22px}
.shortcut.on{border-color:var(--leaf-2);box-shadow:inset 3px 0 0 var(--leaf-2)}
.dep-toggle svg{width:18px;height:18px;flex:0 0 auto}
.dep-toggle .seta{transition:transform .2s;margin-left:auto}
.dep-toggle[aria-expanded="true"] .seta{transform:rotate(180deg)}

/* ===== Celular: atalhos em coluna à esquerda + barra de departamentos fina e fixa ===== */
@media (max-width:860px){
  .layout{grid-template-columns:72px minmax(0,1fr);gap:10px 10px;align-items:start}
  .layout > div:first-child{display:contents}
  .btn.dep-toggle{grid-column:1/-1;position:sticky;top:var(--hdr,0px);z-index:15;padding:6px 12px;font-size:.84rem;min-height:0;
    justify-content:flex-start;gap:8px;border-radius:999px;background:color-mix(in srgb,var(--surface) 88%,transparent);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(30,50,30,.08)}
  aside{grid-column:1/-1}
  aside.open{position:fixed;z-index:16;top:calc(var(--hdr,0px) + 46px);left:12px;right:12px;max-height:calc(100dvh - var(--hdr,0px) - 64px);
    overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.25);overscroll-behavior:contain}
  .shortcuts, body.pg-inicio .shortcuts{display:flex;flex-direction:column;gap:6px;margin:0;grid-column:1;
    position:sticky;top:calc(var(--hdr,0px) + 46px);align-self:start}
  main{grid-column:2}
  body.pg-sobre .shortcuts{display:none}
  body.pg-sobre main{grid-column:1/-1}
  .shortcut{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 3px;border-radius:12px}
  .shortcut .ic{width:38px;height:38px;border-radius:11px}
  .shortcut .ic svg{width:23px;height:23px}
  .shortcut b{font-size:.64rem;line-height:1.15;font-weight:700}
  .shortcut span:not(.ic){display:none}
  .shortcut.on{box-shadow:inset 0 -3px 0 var(--leaf-2)}
}
@media (max-width:600px){
  .search .lupa{left:10px;width:16px;height:16px}
  .search input{padding-left:33px}
  .card{grid-template-columns:76px minmax(0,1fr)}
  .thumb{width:66px;height:66px}
  .thumb .badge,.thumb [class^="b-"]{font-size:.55rem;padding:2px 4px}
  .thumb .b-consulta{display:none}
}

/* ===== Computador grande (1440px+): mais largo, 5 por linha, 2 linhas inteiras na tela ===== */
.thumb,.thumb *{cursor:pointer}
.thumb img{-webkit-user-drag:none;user-select:none}
@media (min-width:1440px){
  .wrap{max-width:1780px;padding-left:40px;padding-right:40px}
  .layout{grid-template-columns:270px minmax(0,1fr);gap:32px;padding-block:16px 72px}
  section.block{margin-top:26px}
  section.block:first-child{margin-top:0}
  .sec-head{margin-bottom:12px}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
  .card .thumb{aspect-ratio:auto;height:176px;overflow:hidden}
  .card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px}
  .card .thumb>svg{max-height:160px;max-width:80%}
  .card .thumb .badge,.card .thumb .ilu-tag{z-index:1}
  .card .cat{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-body{padding:10px 14px 12px;gap:4px}
  .card h3{font-size:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .unit{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .card .price{padding-top:4px}
  .card .btn-add{padding:9px 10px;white-space:nowrap}
  .card .acoes{margin-top:4px}
}
footer .disclaimer{display:block;margin-top:6px;font-size:.72rem;opacity:.75;line-height:1.4}
/* nome ao lado do logo: em arco como no símbolo, verde em degradê com contorno creme */
.brand{gap:16px}
.brand .brand-nome{display:block;width:176px;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));margin-left:2px}
@media (max-width:640px){.brand .brand-nome{display:none}}
/* Sobre: sem a coluna de departamentos; texto largo e mapa mais estreito */
body.pg-sobre .layout{grid-template-columns:minmax(0,1fr)}
body.pg-sobre .layout>div:first-child{display:none}
body.pg-sobre main{grid-column:1/-1}
.about{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
@media (max-width:860px){.about{grid-template-columns:1fr}}
.about .sobre-txt{font-size:1.08rem;line-height:1.6;max-width:70ch}
/* rodapé centralizado */
footer .wrap{text-align:center}
footer .disclaimer{max-width:900px;margin-left:auto;margin-right:auto}

/* ===== botão do pedido no topo (contador sempre à vista) ===== */
.ped-topo{all:unset;box-sizing:border-box;cursor:pointer;position:relative;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#f2f6ee;flex:0 0 auto}
.ped-topo:hover{background:rgba(255,255,255,.12)}
.ped-topo:focus-visible{outline:2px solid var(--seed);outline-offset:2px}
.ped-topo svg{width:23px;height:23px}
.ped-n{position:absolute;top:1px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#f7c45a;color:#1b2a1f;font:800 11px/18px var(--body);text-align:center;box-shadow:0 0 0 2px var(--leaf)}
@media (max-width:860px){ .ped-topo{order:5} }
@media (max-width:600px){ .ped-topo{order:5;width:38px;height:38px} .search{flex-basis:calc(100% - 96px)!important} }
/* ===== carrossel de fotos no detalhe ===== */
.carrossel{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.carrossel::-webkit-scrollbar{display:none}
.carrossel img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;padding:24px;scroll-snap-align:center}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--fg);font-size:1.6rem;line-height:1;cursor:pointer;z-index:2;display:grid;place-items:center}
.car-btn:hover{background:var(--surface)}
.car-btn.ant{left:10px}.car-btn.prox{right:10px}
.car-pontos{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.car-pontos button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#c9c2b4;cursor:pointer}
.car-pontos button[aria-current="true"]{background:var(--leaf-2);width:22px;border-radius:999px}
.mais-fotos{position:absolute;right:8px;bottom:8px;z-index:1;font-size:.68rem;font-weight:700;background:rgba(27,42,31,.75);color:#fff;border-radius:6px;padding:2px 7px}
.copiar-link{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:.88rem;color:var(--muted)}
.copiar-link svg{width:16px;height:16px}
.copiar-link:hover{color:var(--leaf-2)}

/* ===== INÍCIO: carrossel + faixa de departamentos (página larga, sem coluna lateral) ===== */
body.pg-inicio .layout{grid-template-columns:minmax(0,1fr)}
body.pg-inicio .layout>div:first-child{display:none}
body.pg-inicio main{grid-column:1/-1}
.hero{position:relative;border-radius:18px;overflow:hidden;height:clamp(330px,33vw,470px);background:#163a22;color:#fff;isolation:isolate;box-shadow:0 10px 30px rgba(20,40,20,.18)}
.slide{position:absolute;inset:0;display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s}
.slide.on{opacity:1;visibility:visible;z-index:1}
.slide>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.06);transition:transform 7s linear}
.slide.on>.bg{transform:scale(1)}
.slide::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,28,15,.88) 0%,rgba(9,28,15,.62) 42%,rgba(9,28,15,.12) 78%,rgba(9,28,15,0) 100%)}
/* fundo de reserva enquanto a foto não carrega (ou se falhar) */
.slide{background:radial-gradient(circle at 78% 40%,#3f8a52 0%,#1f4d2d 45%,#123020 100%)}
.slide-txt{position:relative;padding:0 clamp(24px,5.5vw,84px);max-width:660px}
.slide .tag{display:inline-flex;align-items:center;gap:6px;background:#fff1c9;color:#5a3e1b;font-weight:800;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;padding:6px 11px;border-radius:99px}
.slide h2{font-family:var(--display);font-size:clamp(1.75rem,3.3vw,3.1rem);line-height:1.04;margin:14px 0 10px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.slide p{font-size:clamp(.95rem,1.25vw,1.15rem);line-height:1.45;color:#eef4ea;margin:0 0 20px;max-width:46ch}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hbtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;font-size:.95rem;background:#fff1c9;color:#3b2a12;text-decoration:none;transition:transform .15s,box-shadow .15s}
.hbtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.sec{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.hbtn.wa{background:#25d366;color:#08311a}
.hbtn:focus-visible,.hero-seta:focus-visible,.hero-pontos button:focus-visible{outline:3px solid #fff1c9;outline-offset:2px}
.hero-seta{all:unset;cursor:pointer;position:absolute;top:50%;z-index:3;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.28);color:#fff;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:.75;transition:opacity .2s,background .2s}
.hero-seta:hover{opacity:1;background:rgba(0,0,0,.45)}
.hero-seta svg{width:22px;height:22px}
.hero-seta.ant{left:14px}.hero-seta.prox{right:14px}
.hero-pontos{position:absolute;left:0;right:0;bottom:16px;z-index:3;display:flex;justify-content:center;gap:8px}
.hero-pontos button{all:unset;cursor:pointer;width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden;position:relative;transition:width .3s}
.hero-pontos button.on{width:38px;background:rgba(255,255,255,.35)}
.hero-pontos button.on::after{content:"";position:absolute;inset:0;background:#fff1c9;transform-origin:left;animation:heroBarra 6s linear forwards}
.hero.pausado .hero-pontos button.on::after{animation-play-state:paused}
@keyframes heroBarra{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* slide da oferta: produto num cartão branco à direita */
.slide.oferta{background:radial-gradient(circle at 75% 45%,#4f9a5f 0%,#245a33 42%,#0f2a18 100%)}
.slide.oferta::before{background:none}
.oferta-prod{position:absolute;right:clamp(24px,6vw,110px);top:50%;transform:translateY(-50%) rotate(2deg);width:clamp(190px,24vw,330px);aspect-ratio:1;background:#fff;border-radius:22px;box-shadow:0 24px 50px rgba(0,0,0,.35);display:grid;place-items:center;padding:18px}
.oferta-prod img{width:100%;height:100%;object-fit:contain}
.oferta-pct{position:absolute;top:-16px;left:-16px;background:#c8412a;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,2vw,1.7rem);width:clamp(68px,7vw,88px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3);transform:rotate(-10deg)}
.oferta-preco{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 20px}
.oferta-preco s{opacity:.75;font-size:1.05rem}
.oferta-preco b{font-family:var(--display);font-size:clamp(2rem,3.4vw,3rem);color:#fff1c9;line-height:1}
.oferta .slide-txt{max-width:min(660px,54%)}
.oferta .slide-txt h2{margin-bottom:6px}
.oferta-meta{font-size:.9rem;font-weight:600;color:#cfe8d3;margin-bottom:10px}
.slide p.oferta-desc{font-size:clamp(.9rem,1.1vw,1.02rem);margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.oferta-eco{background:rgba(255,241,201,.16);color:#fff1c9;border:1px solid rgba(255,241,201,.4);border-radius:99px;padding:4px 10px;font-size:.82rem;font-weight:700;align-self:center}
/* títulos e subtítulos em uma linha só no computador */
@media (min-width:861px){
  .slide-txt{max-width:900px}
  .slide h2{white-space:nowrap;font-size:clamp(1.8rem,2.9vw,3rem)}
  .slide p{max-width:none}
  .slide.oferta{justify-content:center;gap:clamp(40px,4vw,72px);padding-inline:90px}
  .slide.oferta .slide-txt{padding:0;max-width:640px;flex:0 1 auto;min-width:0}
  .slide.oferta h2{overflow:hidden;text-overflow:ellipsis}
  .oferta-prod{position:relative;right:auto;top:auto;transform:rotate(2deg);flex:0 0 auto;width:clamp(220px,20vw,320px)}
}
/* distância maior entre o texto e as setas */
@media (min-width:861px){ .slide-txt{padding-left:calc(14px + 44px + clamp(36px,4.5vw,90px));padding-right:calc(14px + 44px + 24px)} }
/* boas-vindas centralizado */
.slide.centro{justify-content:center;text-align:center}
.slide.centro .slide-txt{max-width:960px;padding-left:24px;padding-right:24px}
.slide.centro p{margin-inline:auto;max-width:72ch}
.slide.centro .hero-btns{justify-content:center}
.slide.centro::before{background:radial-gradient(ellipse at center,rgba(9,28,15,.78) 0%,rgba(9,28,15,.58) 55%,rgba(9,28,15,.4) 100%)}
/* faixa de departamentos com foto */
.cats{margin-top:26px}
.cats-faixa{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:14px}
.cat-tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.cat-tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(30,50,30,.14);border-color:var(--leaf-2)}
.cat-tile:focus-visible{outline:3px solid var(--leaf-2);outline-offset:2px}
.cat-foto{background:#fff;aspect-ratio:4/3;display:grid;place-items:center;padding:12px;position:relative}
.cat-foto img{width:100%;height:100%;object-fit:contain;transition:transform .3s}
.cat-tile:hover .cat-foto img{transform:scale(1.06)}
.cat-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.cat-info b{font-size:.98rem;line-height:1.2}
.cat-info span{font-size:.8rem;color:var(--muted)}
.cat-tile.promo .cat-foto{background:linear-gradient(135deg,#c8412a,#e8743a)}
.cat-tile.promo .cat-foto::after{content:"%";position:absolute;font-family:var(--display);font-weight:800;font-size:4.2rem;color:rgba(255,255,255,.95)}
.vantagens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.vantagens div{display:flex;gap:12px;align-items:center;background:var(--soil-soft);border-radius:12px;padding:12px 14px}
.vantagens svg{width:30px;height:30px;flex:0 0 auto;color:var(--leaf-2)}
.vantagens b{display:block;font-size:.95rem}
.vantagens span{font-size:.82rem;color:var(--muted)}
/* menu Produtos com hover */
.menu-prod{position:relative}
.menu-gatilho{display:inline-flex;align-items:center;gap:4px}
.menu-gatilho svg{width:15px;height:15px;transition:transform .2s}
.menu-caixa{position:absolute;top:100%;left:50%;transform:translate(-50%,6px);padding-top:8px;min-width:270px;z-index:40;opacity:0;visibility:hidden;transition:opacity .16s,transform .16s,visibility .16s}
.menu-caixa>div{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.22);padding:8px;display:flex;flex-direction:column}
@media (hover:hover){
  .menu-prod:hover .menu-caixa{opacity:1;visibility:visible;transform:translate(-50%,0)}
  .menu-prod:hover .menu-gatilho svg{transform:rotate(180deg)}
}
.menu-prod.aberto .menu-caixa,.menu-prod:focus-within .menu-caixa{opacity:1;visibility:visible;transform:translate(-50%,0)}
.menu-prod.aberto .menu-gatilho svg{transform:rotate(180deg)}
nav.main .menu-caixa a,.menu-caixa button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-weight:600;font-size:.93rem;color:var(--fg);box-shadow:none}
nav.main .menu-caixa a:hover,.menu-caixa button:hover,nav.main .menu-caixa a:focus-visible,.menu-caixa button:focus-visible{background:var(--soil-soft)}
.menu-caixa small{margin-left:auto;font-size:.75rem;color:var(--muted);font-weight:500}
.menu-caixa .mi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.menu-caixa .mi svg{width:17px;height:17px}
.menu-caixa hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu-rot{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 10px 2px}
.menu-caixa button{font-weight:500;padding:7px 10px}
nav.main .menu-prod.sem-hover .menu-caixa{opacity:0;visibility:hidden}
@media (max-width:1100px){ .cats-faixa{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:860px){
  .slide p.oferta-desc{display:none}
  .slide.centro{align-items:center}
  .menu-caixa{position:fixed;top:var(--hdr,60px);left:12px;right:12px;transform:none;min-width:0;padding-top:4px}
  .menu-prod.aberto .menu-caixa,.menu-prod:focus-within .menu-caixa{transform:none}
  .hero{height:auto;min-height:440px;border-radius:14px}
  .slide{align-items:flex-end}
  .slide::before{background:linear-gradient(0deg,rgba(9,28,15,.92) 0%,rgba(9,28,15,.7) 45%,rgba(9,28,15,.15) 100%)}
  .slide-txt{padding:0 20px 52px}
  .hero-seta{display:none}
  .oferta .slide-txt{max-width:none}
  .oferta-prod{top:22px;right:50%;transform:translateX(50%) rotate(2deg);width:170px;padding:12px}
  .oferta-pct{width:60px;font-size:1.1rem;top:-10px;left:-14px}
  .cats{margin-top:18px}
  .cats-faixa{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
  .cat-tile{flex:0 0 42%;scroll-snap-align:start}
  .vantagens{grid-template-columns:1fr;gap:8px}
}
@media (prefers-reduced-motion:reduce){ .slide,.slide>.bg,.cat-tile,.cat-foto img{transition:none} .slide>.bg{transform:none} }

/* ===== Polimento de layout (out/2026) ===== */
/* faixa de departamentos: todas as fotos com a mesma altura (4:3), nomes alinhados */
.cat-foto{overflow:hidden}
.cat-foto img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px)}
/* foco de teclado visível em todos os botões e links */
nav.main a:focus-visible,.brand:focus-visible{outline:2px solid #f7dc94;outline-offset:2px}
.brand:focus-visible{outline-offset:4px;border-radius:12px}
nav.main .menu-caixa a:focus-visible,.menu-caixa button:focus-visible{outline:2px solid var(--leaf-2);outline-offset:-2px}
.link:focus-visible,.car-btn:focus-visible,.fechar:focus-visible,.car-pontos button:focus-visible{outline:2px solid var(--leaf-2);outline-offset:2px;border-radius:4px}
.fechar:focus-visible,.car-btn:focus-visible{border-radius:50%}
.wa-float:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.fechar{width:40px;height:40px}
/* modo escuro: botões e selos com contraste suficiente */
:root[data-theme="dark"]{--wa:#1f7f47}
:root[data-theme="dark"] .btn-add,:root[data-theme="dark"] .btn-seed{background:#2a7a44}
:root[data-theme="dark"] .btn-add:hover{background:#2f8a4d}
:root[data-theme="dark"] .opcoes button.on{color:#0f1611}
:root[data-theme="dark"] .b-promo{color:#2a0d07}
:root[data-theme="dark"] .b-consulta{color:#1b2a1f}
:root[data-theme="dark"] .pedido-bar button{background:#1f4d2d;box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)}
:root{--wa:#1a7f47}
/* "+ Adicionar ao pedido" cabe em uma linha nos cards */
@media (min-width:601px){ .card .btn-add{font-size:.9rem;padding-left:8px;padding-right:8px} }
@media (max-width:600px){ .btn-add,.acoes .btn-wa{padding-left:8px;padding-right:8px} }
/* tablet (601–860 px): menu na mesma linha do logo; faixas mais equilibradas */
@media (min-width:601px) and (max-width:860px){
  nav.main{order:2;width:auto;margin-left:auto}
  .cat-tile{flex-basis:29%}
  .vantagens{grid-template-columns:repeat(3,minmax(0,1fr))}
  .vantagens div{flex-direction:column;align-items:flex-start;gap:6px}
}
/* celular e tablet: áreas de toque com pelo menos 40 px */
@media (max-width:860px){
  nav.main a{min-height:40px;display:inline-flex;align-items:center}
  .tema-btn,.ped-topo{width:40px;height:40px}
  .search input{min-height:40px}
  .btn.dep-toggle{min-height:40px}
  .btn-add,.acoes .btn-wa{min-height:40px}
  .qtd button{height:40px}
  .mini-q{grid-template-columns:40px 30px 40px}
  .mini-q button{height:40px}
  .opcoes button{min-height:34px;display:inline-flex;align-items:center}
  .link.limpar,.copiar-link,.sec-head .link{padding-block:10px;margin-block:-10px}
  /* carrossel: a altura acompanha o slide mais alto, assim a oferta não sobrepõe o texto */
  .hero{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch;padding:0;gap:0}
  .hero>.slide{position:relative;inset:auto;grid-area:1/1;min-height:440px}
  /* oferta compacta: foto pequena ao lado do título */
  .slide.oferta{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-content:end;padding:0 20px 52px}
  .slide.oferta .slide-txt{display:contents}
  .slide.oferta .tag{grid-column:1/-1;justify-self:start}
  .slide.oferta h2{grid-column:1;margin:12px 0 4px;font-size:clamp(1.45rem,5.6vw,2rem);line-height:1.08}
  .slide.oferta .oferta-meta{grid-column:1;margin-bottom:0}
  .slide.oferta .oferta-prod{grid-column:2;grid-row:2/4;align-self:center;position:relative;top:auto;right:auto;transform:rotate(3deg);width:clamp(92px,22vw,150px);padding:8px;border-radius:16px;margin:10px 4px 0 0}
  .slide.oferta .oferta-pct{width:44px;font-size:.9rem;top:-12px;left:-14px}
  .slide.oferta .oferta-preco{grid-column:1/-1;margin:12px 0 14px;gap:8px 12px}
  .slide.oferta .hero-btns{grid-column:1/-1}
}
@media (max-width:600px){ .search{flex-basis:calc(100% - 104px)!important} .qtd{grid-template-columns:40px 1fr 40px} }
/* links de contato do Sobre com área de toque maior (sem mudar o visual) */
@media (max-width:860px){ .panel dd .link,.map-foot .link{display:inline-block;padding-block:11px;margin-block:-11px} }
/* pontos dos carrosséis: área de clique maior com borda transparente; visual igual */
.hero-pontos{gap:0;bottom:2px}
.hero-pontos button,.hero-pontos button.on{border-style:solid;border-color:transparent;border-width:15px 4px;border-radius:8.5px/19.5px}
.hero-pontos button,.hero-pontos button.on,.car-pontos button,.car-pontos button[aria-current="true"]{background-clip:padding-box}
.car-pontos{gap:0;bottom:0}
.car-pontos button,.car-pontos button[aria-current="true"]{box-sizing:content-box;border-style:solid;border-color:transparent;border-width:13px 3px;border-radius:7.5px/17.5px}
@media (min-width:601px) and (max-width:860px){
  .slide.oferta{column-gap:28px}
  .slide.oferta .tag,.slide.oferta .oferta-preco,.slide.oferta .hero-btns{grid-column:1}
  .slide.oferta .oferta-prod{grid-row:1/6;width:180px;padding:12px;margin:0 24px 0 0}
}
@media (max-width:480px){
  .slide .tag{letter-spacing:.05em;font-size:.68rem;border-radius:12px;text-align:center;justify-content:center}
  .slide.oferta .hero-btns{gap:8px}
  .slide.oferta .hbtn{padding:10px 14px;font-size:.9rem;min-height:42px}
  .slide.oferta .oferta-preco b{font-size:1.9rem}
  .slide.oferta .oferta-eco{font-size:.76rem;padding:3px 9px}
}

/* ===== Selo aberto/fechado ===== */
.selo-hora{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--soil);line-height:1.3}
.selo-hora::before{content:"";width:8px;height:8px;border-radius:50%;background:#b8694f;flex:0 0 auto}
.selo-hora.aberto{color:var(--leaf-2)}
.selo-hora.aberto::before{background:#2fa863;box-shadow:0 0 0 3px rgba(47,168,99,.2)}
.selo-hora:empty{display:none}
.vantagens .selo-hora{display:flex;margin-top:3px}
.hora-ped{margin:6px 0 0}
/* ===== Rodapé completo ===== */
footer .wrap.rodape{text-align:left}
.rod-grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 28px}
.rod-col h2{font-family:var(--display);font-size:1.05rem;color:var(--fg);margin:0 0 6px}
.rod-col p{margin:0 0 6px;line-height:1.5}
.rod-col .link{font-size:.9rem;display:inline-block;padding-block:10px;margin-block:-10px}
.rod-col .selo-hora{margin-top:2px}
.rod-aviso{margin-top:18px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;font-size:.8rem;line-height:1.45;color:var(--fg)}
.rod-aviso b{display:block;margin-bottom:2px;font-size:.84rem}
.rod-fim{margin:12px 0 0;font-size:.78rem;text-align:center}
@media (max-width:600px){ .rod-grade{grid-template-columns:1fr;gap:16px} }

/* ===== Departamentos: uma lista só no computador (sanfona com ícones) ===== */
.shortcuts{display:none!important}
summary{justify-content:flex-start;gap:10px}
summary::after{margin-left:auto}
.dep-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.dep-ic svg{width:18px;height:18px}
details[open] > summary .dep-nome{color:var(--leaf-2)}
/* ===== Chips de departamento (só celular/tablet) ===== */
.chips-dep{display:none}
@media (max-width:860px){
  .chips-dep{display:flex;flex-direction:column;gap:8px;margin:0 -16px 14px;}
  .chips-linha{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 16px;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .chips-linha::-webkit-scrollbar{display:none}
  .chip{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:.86rem;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .chip:focus-visible{outline:2px solid var(--leaf-2);outline-offset:2px}
  .chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
  :root[data-theme="dark"] .chip.on{background:#2a7a44;border-color:#2a7a44}
  .chip-ic{display:grid;place-items:center}
  .chip-ic svg{width:18px;height:18px}
  .chip.on .chip-ic{color:#fff!important}
  :root[data-theme="dark"] .chip-ic{color:var(--leaf-2)!important}
  .chips-linha.sub .chip{min-height:40px;font-size:.8rem;padding:0 12px;background:transparent}
  .chips-linha.sub .chip.on{background:var(--seed);color:var(--seed-ink);border-color:var(--warn-line)}
  /* lista ocupa a largura toda; departamentos pelos chips e pela barra de baixo */
  .layout,body.pg-inicio .layout{grid-template-columns:minmax(0,1fr)}
  main{grid-column:1}
  .btn.dep-toggle{display:none!important}
  aside.open{top:calc(var(--hdr,0px) + 10px);max-height:calc(100dvh - var(--hdr,0px) - 90px - env(safe-area-inset-bottom,0px))}
}
/* ===== Barra fixa embaixo (celular/tablet) ===== */
.barra-cel{display:none}
@media (max-width:860px){
  .barra-cel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--leaf);color:#f2f6ee;padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.08)}
  .barra-cel button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:10px;font-size:.7rem;font-weight:600;-webkit-tap-highlight-color:transparent}
  .barra-cel svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .barra-cel button[aria-current="page"],.barra-cel button.atual,.barra-cel button[aria-expanded="true"]{color:#f7dc94}
  .barra-cel button[aria-current="page"]::before,.barra-cel button.atual::before,.barra-cel button[aria-expanded="true"]::before{content:"";position:absolute;top:-4px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:#f7dc94}
  .barra-cel button:focus-visible{outline:2px solid #f7dc94;outline-offset:-2px}
  .barra-cel .ped-n{top:3px;right:calc(50% - 22px)}
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  /* o resumo do pedido e a cesta do topo ficam na barra */
  .pedido-bar{display:none!important}
  .ped-topo{display:none}
  body.tem-pedido footer{padding-bottom:28px}
  body.tem-pedido .wa-float{display:flex}
  .wa-float{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:600px){ .search{flex-basis:calc(100% - 52px)!important} }

/* ===== Repetir último pedido ===== */
.btn-repetir{width:100%;justify-content:flex-start;gap:12px;background:var(--soil-soft);color:var(--fg);border:1.5px solid var(--leaf-2);padding:12px 14px;text-align:left;min-height:56px}
.btn-repetir:hover{background:var(--seed)}
.btn-repetir svg{width:24px;height:24px;flex:0 0 auto;fill:none;stroke:var(--leaf-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-repetir small{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}
.aviso-rep{margin:12px 0 0;font-size:.82rem;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:8px 10px}

/* ===== CALCULADORAS DO CAMPO ===== */
body.pg-calc .layout{grid-template-columns:minmax(0,1fr)}
body.pg-calc .layout>div:first-child{display:none}
body.pg-calc main{grid-column:1/-1}
.calc-abas{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.calc-abas button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;color:var(--fg)}
.calc-abas button svg{width:20px;height:20px;color:var(--leaf-2)}
.calc-abas button[aria-pressed="true"]{background:var(--leaf-2);border-color:var(--leaf-2);color:#fff}
.calc-abas button[aria-pressed="true"] svg{color:#fff1c9}
.calc-abas button:focus-visible{outline:3px solid var(--seed);outline-offset:2px}
.calc-grade{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.calc-form,.calc-res{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.calc-form h3,.calc-res h3{font-family:var(--display);font-size:1.15rem;margin:0 0 4px;color:var(--leaf-2)}
.calc-form .intro{margin:0 0 16px;color:var(--muted);font-size:.93rem}
.cf{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.cf>span{font-weight:700;font-size:.92rem}
.cf small{color:var(--muted);font-size:.8rem;line-height:1.35}
.cf input,.cf select{font:inherit;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg,#fff);color:var(--fg);width:100%;box-sizing:border-box}
.cf input:focus,.cf select:focus{outline:3px solid var(--seed);border-color:var(--leaf-2)}
.cf-linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.cf-un{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px}
.cf-modo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cf-modo label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;font-size:.92rem}
.cf-modo label:has(input:checked){border-color:var(--leaf-2);background:color-mix(in srgb,var(--leaf-2) 10%,transparent)}
.cf-modo input{accent-color:var(--leaf-2);width:18px;height:18px}
.calc-res{position:sticky;top:calc(var(--hdr,0px) + 14px)}
.res-num{font-family:var(--display);font-size:clamp(2rem,4vw,2.8rem);line-height:1.05;color:var(--leaf-2);margin:6px 0 2px}
.res-sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.res-prod{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--soil-soft);margin:12px 0}
.res-prod img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px;flex:0 0 auto}
.res-prod b{display:block;font-size:.95rem}
.res-prod span{font-size:.85rem;color:var(--muted)}
.res-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin:4px 0 12px}
.res-total b{font-family:var(--display);font-size:1.4rem;color:var(--fg)}
.res-btns{display:flex;flex-direction:column;gap:8px}
.res-btns .btn-calc{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;min-height:46px;padding:11px 14px;border-radius:10px;font-weight:700;background:var(--leaf-2);color:#fff}
.res-btns .btn-calc.sec{background:transparent;color:var(--leaf-2);box-shadow:inset 0 0 0 1.5px var(--leaf-2)}
.res-btns .btn-calc:focus-visible{outline:3px solid var(--seed);outline-offset:2px}
.res-ok{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--leaf-2) 12%,transparent);font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.res-ok button{all:unset;cursor:pointer;text-decoration:underline;font-weight:700;color:var(--leaf-2)}
.res-vazio{color:var(--muted);margin:8px 0 0}
.res-aviso{font-size:.8rem;color:var(--muted);line-height:1.4;margin:14px 0 0;border-top:1px dashed var(--line);padding-top:10px}
.res-alerta{background:var(--warn-bg,#fff6dd);border:1px solid var(--warn-line,#ecd9a6);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:8px 0 0}
.calc-chamada{margin-top:26px}
.calc-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.calc-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:transform .18s,box-shadow .18s,border-color .18s}
.calc-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,50,30,.12);border-color:var(--leaf-2)}
.calc-card:focus-visible{outline:3px solid var(--leaf-2);outline-offset:2px}
.calc-card .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--leaf-2) 12%,transparent);color:var(--leaf-2);flex:0 0 auto}
.calc-card .ic svg{width:26px;height:26px}
.calc-card b{display:block;font-size:1rem}
.calc-card span.t{font-size:.85rem;color:var(--muted)}
.det-calc{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:700}
:root[data-theme="dark"] .res-btns .btn-calc:not(.sec),:root[data-theme="dark"] .calc-abas button[aria-pressed="true"]{background:#2a7a44;border-color:#2a7a44;color:#fff}
:root[data-theme="dark"] .res-btns .btn-calc.sec{color:#9fd6aa;box-shadow:inset 0 0 0 1.5px #9fd6aa}
@media (max-width:860px){
  .calc-grade{grid-template-columns:1fr}
  .calc-res{position:static}
  .calc-cards{grid-template-columns:1fr;gap:8px}
  .calc-card{padding:12px 14px}
  .calc-abas button{flex:1 1 auto;justify-content:center;padding:8px 12px}
}

function prepararMuda(p){
  const t = TAM_BANDEJA(p); if(!t || p.bandeja) return p;
  p.bandeja = t; p.lote = 1;
  if(p.precoBandeja===undefined) p.precoBandeja = null;
  p.opcoes = ["Por muda", `${OP_BANDEJA} (${t})`];
  p.opNome = "Quantidade";
  p.un = `Vendida por muda · bandeja com ${t}`;
  return p;
}

/* ===== PEDIDO (vários itens numa mensagem só) ===== */
let PEDIDO = {};
try{ PEDIDO = JSON.parse(localStorage.getItem("defema-pedido")||"{}") || {}; }catch(_){ PEDIDO = {}; }
const doPedido = k => { const [n,op] = k.split("||"); const p = PRODUTOS.find(x=>base(x)===n); return p && (!op || (p.opcoes||[]).includes(op)) ? {p, op:op||null, k, q:PEDIDO[k]} : null; };
Object.keys(PEDIDO).forEach(k=>{ if(!doPedido(k)) delete PEDIDO[k]; });
const itensPedido = () => Object.keys(PEDIDO).map(doPedido).filter(x=>x&&x.q>0);
/* ===== último pedido enviado (fica só neste aparelho) ===== */
let avisoRepetir = "";
function lerUltimo(){ try{ const u = JSON.parse(localStorage.getItem("defema-ultimo-pedido")||"null"); return u && u.itens && typeof u.itens==="object" ? u : null; }catch(_){ return null; } }
function ultimoPedido(){
  const u = lerUltimo(); if(!u) return null;
  const ks = Object.keys(u.itens).filter(k=>+u.itens[k]>0 && doPedido(k));
  if(!ks.length) return null;
  let data = ""; try{ data = new Date(u.em).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",timeZone:"America/Sao_Paulo"}); }catch(_){}
  return {ks, itens:u.itens, n:ks.length, total:Object.keys(u.itens).length, data};
}
function repetirPedido(){
  const u = ultimoPedido(); if(!u) return;
  u.ks.forEach(k=>{ PEDIDO[k] = Math.round(+u.itens[k]) || 1; });
  const fora = u.total - u.n;
  avisoRepetir = fora ? `${fora} ${fora===1?"item do último pedido não está mais":"itens do último pedido não estão mais"} no catálogo e ${fora===1?"ficou":"ficaram"} de fora.` : "";
  salvarPedido();
  document.querySelectorAll("[data-acoes]").forEach(el=>el.innerHTML=acoes(PRODUTOS[el.dataset.acoes]));
  atualizarPedido();
  if(!document.getElementById("dlgPedido").open) desenharPedido();
}
function salvarPedido(){ try{ localStorage.setItem("defema-pedido", JSON.stringify(PEDIDO)); }catch(_){} }
function mudarQtd(p, delta, k=chave(p)){
  const q = Math.max(0,(PEDIDO[k]||0)+delta);
  if(q) PEDIDO[k]=q; else delete PEDIDO[k];
  salvarPedido(); atualizarPedido(p);
}
function totais(){
  const it = itensPedido();
  const qtd = it.reduce((a,x)=>a+(x.p.porMetro?1:x.q),0);

  trado:"cavadeira", boca:"cavadeira chave", buraqueira:"cavadeira", cavadeira:"cavadeira", pa:"pa",
  tesourao:"tesoura poda", podao:"tesoura poda facao", serra:"serrote", faca:"facao", machete:"facao",

  mudinha:"mudas", verdura:"sementes hortalicas", hortalica:"sementes hortalicas", horta:"sementes mudas", tempero:"cebolinha salsa coentro"
};
const PARADAS = new Set(["de","da","do","das","dos","pra","para","pro","com","e","a","o","as","os","um","uma","no","na"]);
const semAcento = t => t.toLowerCase().replace(/(\d)\s*[x×]\s*(\d)/g,"$1x$2").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
function fonetico(w){
  return w
    .replace(/ph/g,"f").replace(/lh/g,"li").replace(/nh/g,"ni").replace(/(ch|sh)/g,"x")
    .replace(/qu(?=[ei])/g,"k").replace(/qu/g,"ku").replace(/c(?=[ei])/g,"s").replace(/c/g,"k")
    .replace(/gu(?=[ei])/g,"g").replace(/g(?=[ei])/g,"j").replace(/ç/g,"s").replace(/(sc|xc|ss)(?=[ei])/g,"s").replace(/z/g,"s")
    .replace(/y/g,"i").replace(/w/g,"v").replace(/h/g,"")
    .replace(/l$/,"u").replace(/m$/,"n")
    .replace(/(.)\1+/g,"$1");
}
const palavras = t => semAcento(t).split(/\s+/).filter(w=>w && !PARADAS.has(w));
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) cur[j]=Math.min(cur[j],prev[j-2]+1); // letras invertidas
    }
    prev=cur;
  }
  return prev[b.length];
}
const tolerancia = n => n<=3 ? 0 : n<=7 ? 1 : 2;
/* nota de 0 a 1 de quanto a palavra digitada combina com uma palavra do produto */
function nota(q, w){
  if(w===q) return 1;
  if(w.startsWith(q)) return q.length>=2 ? .9 : 0;          // digitando pela metade
  if(q.length>=4 && w.includes(q)) return .75;
  const t = tolerancia(q.length);
  if(!t || q[0]!==w[0]) return 0;                           // erro de digitação raramente é na 1ª letra
  if(lev(q,w)<=t) return .7;                                // palavra inteira com erro
  if(q.length>=5 && w.length>q.length && lev(q,w.slice(0,q.length))<=t) return .6; // pedaço com erro
  return 0;
}
const INDICE = new Map();
function indice(p){
  if(!INDICE.has(p)){
    const ws = palavras([p.nome,p.marca||"",p.sub,p.dep,p.un,...(p.opcoes||[])].join(" "));
    ws.push(semAcento(p.nome).replace(/\s+/g,""));          // "kothrine" acha "K-Othrine"
    INDICE.set(p,[...new Set(ws.flatMap(w=>[w,fonetico(w)]))]);
  }
  return INDICE.get(p);
}
const FRASES = [
  [/(remedio|veneno|isca|po|produto|matar)( (de|pra|para|contra|o|a))*( formigas?| formigueiro| sauvas?)/g,"formicida"],
  [/(remedio|veneno|isca|produto|matar)( (de|pra|para|contra))*( lesmas?| caramujos?| caracol)/g,"lesmicida"],
  [/(remedio|veneno|produto|matar)( (de|pra|para|contra|no|o))*( carrapatos?)/g,"carrapaticida"],
  [/(remedio|veneno|produto|matar)( (de|pra|para|contra))*( moscas?| mosquitos?| pernilongos?)/g,"mosquicida"],
  [/(remedio|veneno|produto|matar)( (de|pra|para|contra))*( baratas?| escorpi(ao|oes))/g,"inseticida"],
  [/bomba (de |pra |para )?(veneno|passar veneno)|maquina (de |pra )?veneno|passar veneno/g,"pulverizador"],
  [/cortar (grama|mato)|maquina de cortar/g,"rocadeira"],
  [/chave de boca|chave boca/g,"chave combinada"]
];
function buscar(texto, lista){
  let t = semAcento(texto); FRASES.forEach(([re,sub])=>t=t.replace(re,sub));
  const termos = palavras(t).map(w=>{
    const alt = new Set([w,fonetico(w)]);
    const sin = SINONIMOS[w] || SINONIMOS[fonetico(w)] || Object.entries(SINONIMOS).find(([k])=>w.length>=5&&k[0]===w[0]&&lev(w,k)<=tolerancia(w.length))?.[1];
    if(sin) sin.split(" ").forEach(x=>{alt.add(x);alt.add(fonetico(x));});
    return [...alt];
  });
  if(!termos.length) return {list:lista, parecidos:false};
  const pont = lista.map(p=>{
    const ws = indice(p);
    const notas = termos.map(alts=>Math.max(0,...alts.flatMap(a=>ws.map(w=>nota(a,w)))));
    return {p, achou:notas.filter(n=>n>0).length, total:notas.reduce((a,b)=>a+b,0)};
  });
  const todos = pont.filter(x=>x.achou===termos.length);
  const algum = todos.length ? todos : pont.filter(x=>x.achou>0);
  algum.sort((a,b)=>b.total-a.total);
  const melhor = algum.length ? algum[0].total : 0;
  return {list:algum.filter(x=>x.total>=melhor*.75).map(x=>x.p), parecidos:!todos.length && algum.length>0};
}

/* ===== HORÁRIO (sempre pelo relógio de Brasília, não pelo do aparelho) ===== */
const HORARIO = {1:[8,17],2:[8,17],3:[8,17],4:[8,17],5:[8,17],6:[8,12]};   // 0 = domingo (fechado)
const DIAS = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
function agoraBrasilia(){
  try{
    const f = new Intl.DateTimeFormat("en-US",{timeZone:"America/Sao_Paulo",weekday:"short",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date());
    const g = t => (f.find(x=>x.type===t)||{}).value;
    return {dia:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")), min:(+g("hour")%24)*60 + +g("minute")};
  }catch(_){ const d = new Date(Date.now() - 3*3600e3); return {dia:d.getUTCDay(), min:d.getUTCHours()*60+d.getUTCMinutes()}; }  // Brasília = UTC−3
}
function situacaoLoja(){
  const {dia,min} = agoraBrasilia(), h = HORARIO[dia];
  if(h && min >= h[0]*60 && min < h[1]*60) return {aberto:true, texto:`Aberto agora · fecha às ${h[1]}h`};
  if(h && min < h[0]*60) return {aberto:false, texto:`Fechado · abre hoje às ${h[0]}h`};
  for(let i=1;i<=7;i++){ const d=(dia+i)%7; if(HORARIO[d]) return {aberto:false, texto:`Fechado · abre ${i===1?"amanhã":DIAS[d]} às ${HORARIO[d][0]}h`}; }
  return {aberto:false, texto:"Fechado"};
}
function atualizarHora(){
  const s = situacaoLoja();
  document.querySelectorAll("[data-hora]").forEach(el=>{ el.textContent = s.texto; el.classList.toggle("aberto", s.aberto); });
}

let heroI = 0, heroTimer = null;
function heroMostrar(i){
  const h = document.getElementById("hero"); if(!h) return;
  const sl = h.querySelectorAll(".slide"), pt = h.querySelectorAll(".hero-pontos button");
  heroI = (i + sl.length) % sl.length;
  sl.forEach((s,k)=>{ s.classList.toggle("on", k===heroI); s.setAttribute("aria-hidden", k!==heroI); s.inert = k!==heroI; });
  pt.forEach((b,k)=>{ b.classList.remove("on"); if(k===heroI){ void b.offsetWidth; b.classList.add("on"); b.setAttribute("aria-current","true"); } else b.removeAttribute("aria-current"); });
}
function heroAgendar(){
  clearInterval(heroTimer);
  const h = document.getElementById("hero");
  if(!h || h.classList.contains("pausado") || document.hidden) return;
  heroTimer = setInterval(()=>heroMostrar(heroI+1), 6000);
}
function iniciarHero(){
  clearInterval(heroTimer);
  const h = document.getElementById("hero"); if(!h) return;
  const n = h.querySelectorAll(".slide").length;
  heroMostrar(heroI < n ? heroI : 0); heroAgendar();
  const pausar = v => { h.classList.toggle("pausado", v); if(v) clearInterval(heroTimer); else { heroMostrar(heroI); heroAgendar(); } };
  h.addEventListener("mouseenter", ()=>pausar(true));
  h.addEventListener("mouseleave", ()=>pausar(false));
  h.addEventListener("click", e=>{
    const b = e.target.closest("[data-hero],[data-hero-ir]"); if(!b) return;
    heroMostrar(b.dataset.hero!=null ? heroI + +b.dataset.hero : +b.dataset.heroIr); heroAgendar();

  m.classList.remove("aberto"); if(m.matches(":hover")) m.classList.add("sem-hover"); m.querySelector(".menu-gatilho").setAttribute("aria-expanded","false");
  if(m.contains(document.activeElement)) document.activeElement.blur();
}
(function(){
  const m = document.getElementById("menuProd"), g = m.querySelector(".menu-gatilho");
  const toque = matchMedia("(hover: none)");
  g.addEventListener("click", e=>{
    if(!toque.matches) return;            // computador: clique leva para Produtos
    e.preventDefault(); e.stopPropagation();
    const ab = !m.classList.contains("aberto");
    m.classList.toggle("aberto", ab); g.setAttribute("aria-expanded", ab);
    if(!ab) g.blur();
  }, true);
  m.addEventListener("mouseenter", ()=>g.setAttribute("aria-expanded","true"));
  m.addEventListener("mouseleave", ()=>{ g.setAttribute("aria-expanded","false"); m.classList.remove("sem-hover"); });
  document.addEventListener("click", e=>{ if(!e.target.closest("#menuProd")) fecharMenuProd(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") fecharMenuProd(); });
})();

renderAtalhos();
renderMenuProd();
atualizarPedido();
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{ if(e.target===d) d.close(); }));
/* esconde o botão do WhatsApp quando o rodapé aparece, para não tapar o texto */
try{ new IntersectionObserver(([e])=>document.getElementById("waFloat").classList.toggle("oculto", e.isIntersecting))
  .observe(document.querySelector("footer")); }catch(_){}

const h = location.hash.replace("#","");
if(["inicio","produtos","sobre","calculadoras"].includes(h)) state.page = h;
/* departamento novo criado no painel: usa ícone e cores padrão */
function coresPadrao(){
  Object.keys(DEPS).forEach(d=>{ ICON[d] ??= ICON["Ferramentas"]; TINT[d] ??= "#eef0ec"; INK[d] ??= "#1f4d2d"; });
}
/* chega catálogo novo do Supabase: troca e redesenha a tela atual */
function atualizarCatalogo(d){
  if(!trocarCatalogo(d)) return;
  coresPadrao();
  for(const k in SEL) delete SEL[k];
  const hashAntes = location.hash;
  const dlg = document.getElementById("dlgProduto"); if(dlg.open) dlg.close();
  if(/^#produto\//.test(hashAntes)) history.replaceState(null, "", hashAntes); // catálogo novo não perde o produto aberto
  if(state.dep && !DEPS[state.dep]) { state.dep = null; state.sub = null; }
  renderAtalhos(); renderMenuProd(); atualizarPedido(); render();
  abrirDoHash();
}
coresPadrao();
renderAtalhos();
render();
abrirDoHash();
function buscarCatalogo(){
  carregarCatalogo({ ...SUPABASE, fallback: EMBUTIDO, onAtualizar: atualizarCatalogo }).then(atualizarCatalogo);
}
if(TEM_SUPABASE){
  buscarCatalogo();
  /* aba ou app que ficou aberto: ao voltar para o site, confere se a loja mudou preços/produtos */
  let ultimaBusca = Date.now();
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState!=="visible" || Date.now()-ultimaBusca < 30000) return;
    ultimaBusca = Date.now(); buscarCatalogo();
  });
}

/* ---------- Modo escuro: botão no topo, escolha salva neste aparelho ---------- */
(function(){
  const raiz = document.documentElement, btn = document.getElementById("btnTema");
  const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  const salvo = () => { try { return localStorage.getItem("defema-tema"); } catch(e) { return null; } };
  function marcar(){
    const escuro = raiz.getAttribute("data-theme") === "dark";
    const txt = escuro ? "Mudar para modo claro" : "Mudar para modo escuro";
    btn.setAttribute("aria-label", txt); btn.title = txt; btn.setAttribute("aria-pressed", escuro);
    const cor = document.querySelector('meta[name="theme-color"]'); if (cor) cor.content = escuro ? "#0f2618" : "#163a22";
  }
  btn.addEventListener("click", () => {
    const novo = raiz.getAttribute("data-theme") === "dark" ? "light" : "dark";
    raiz.setAttribute("data-theme", novo);
    try { localStorage.setItem("defema-tema", novo); } catch(e) {}
    marcar();
  });
  if (mq && mq.addEventListener) mq.addEventListener("change", e => { if (!salvo()) { raiz.setAttribute("data-theme", e.matches ? "dark" : "light"); marcar(); } });
  marcar();
})();

/* ---------- versão nova publicada? recarrega sozinho (evita página antiga aberta há horas) ---------- */
(function(){
  const VERSAO = "202610270914";
  let ultima = 0;
  async function conferir(){
    if(Date.now() - ultima < 60000) return; ultima = Date.now();
    try{
      const v = (await fetch("versao.txt?t=" + Date.now(), {cache:"no-store"}).then(r => r.ok ? r.text() : "")).trim();
      if(v && v !== VERSAO && !document.querySelector("dialog[open]")) location.reload();
    }catch(_){}
  }
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") conferir(); });
  setInterval(conferir, 30 * 60000);
})();
</script>
